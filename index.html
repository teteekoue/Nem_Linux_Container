<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>NemLinux Container</title>
  </head>
  <body>
    <main>
      <header>
        <h1>NemLinux Container</h1>
        <p>Votre Linux dans le navigateur</p>
      </header>
      <section class="controls" aria-label="Cycle de vie de la machine virtuelle">
        <label for="memory">Mémoire</label>
        <select id="memory">
          <option value="128">128 Mo</option>
          <option value="256">256 Mo</option>
        </select>
        <button id="resume" type="button">Reprendre la session</button>
        <button id="fresh" type="button">Nouvelle session</button>
        <button id="connect-drive" type="button">Connecter Google Drive</button>
        <span id="status" role="status" aria-live="polite">Prêt</span>
      </section>
      <div id="terminal" aria-label="Terminal Linux"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
